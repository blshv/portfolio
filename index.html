wrap.querySelector('.bs-back').addEventListener('click', close);
wrap.querySelector('.bs-close').addEventListener('click', close);
let py = null;
panel.addEventListener('touchstart', (e) => { py = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchend', (e) => { if (py != null && e.changedTouches[0].clientY - py > 60) close(); py = null; }, { passive: true });
const onKey = (e) => { if (e.key === 'Escape') close(); };
document.addEventListener('keydown', onKey);
const mq = window.matchMedia('(max-width: 1119.98px), (hover: none)');
const onClick = (e) => {
// tools widget: tap an app icon → the same text as the desktop hint, in the sheet
const app = e.target.closest && e.target.closest('.tl-app');
if (app && mq.matches) {
const tip = app.querySelector('.tl-tip'), face = app.querySelector('.tl-face');
if (!tip) return;
e.preventDefault();
body.innerHTML = '<div class="bs-tool"><span class="bs-tool-ico">' + (face ? face.innerHTML : '') + '</span>' + tip.innerHTML + '</div>';
wrap.classList.add('open');
root.style.overflow = 'hidden';
return;
}
const a = e.target.closest && e.target.closest('a.ft-btn');
if (!a || !mq.matches) return;
const card = a.querySelector('.ft-card');
if (!card) return;
e.preventDefault();
body.innerHTML = card.innerHTML;
wrap.classList.add('open');
root.style.overflow = 'hidden';
};
document.addEventListener('click', onClick);
this.respCleanup = () => {
window.removeEventListener('resize', apply);
document.removeEventListener('click', onClick);
document.removeEventListener('keydown', onKey);
if (ph) { ph.removeEventListener('touchstart', ts); ph.removeEventListener('touchend', te); }
wrap.remove();
};
}

statusBar() {
const ru = this.state.lang === 'ru';
if (typeof document !== 'undefined') {
document.documentElement.classList.toggle('en', !ru);
document.documentElement.lang = ru ? 'ru' : 'en';
}
const d = new Date(this.state.now);
const pad = (v) => (v < 10 ? '0' : '') + v;
const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
const daysRu = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const monRu = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
const daysEn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const monEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const NB = '\u00a0';
const clock = ru
? daysRu[d.getDay()] + ',' + NB + d.getDate() + NB + monRu[d.getMonth()] + NB + hm
: daysEn[d.getDay()] + NB + d.getDate() + NB + monEn[d.getMonth()] + NB + hm;
const h = d.getHours();
const greet = ru
? (h >= 5 && h < 12 ? 'Доброе утро!' : h < 17 && h >= 12 ? 'Добрый день!' : h >= 17 && h < 23 ? 'Добрый вечер!' : 'Доброй ночи, вы' + NB + 'не' + NB + 'спите?')
: (h >= 5 && h < 12 ? 'Good morning!' : h < 17 && h >= 12 ? 'Good afternoon!' : h >= 17 && h < 23 ? 'Good evening!' : 'Good night. Still up?');
let mine = '';
try {
mine = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Belgrade', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
} catch (e) { mine = hm; }
const batt = this.state.batt == null ? 100 : this.state.batt;
// battery hint reacts to the visitor's real battery (or a playful default where the API is missing)
let battHint;
if (this.state.batt == null) battHint = ru ? 'Заряжен на' + NB + 'новые проекты' : 'Fully charged for new projects';
else if (this.state.charging) battHint = ru ? 'Пока заряжается, можно посмотреть пару кейсов' : 'Charging? Perfect time for a couple of cases';
else if (batt >= 80) battHint = ru ? 'Заряда хватит на' + NB + 'всё портфолио' : 'Enough charge for the whole portfolio';
else if (batt >= 30) battHint = ru ? 'Заряда хватит, чтобы досмотреть до' + NB + 'конца' : 'Enough to scroll to the end';
else battHint = ru ? 'Батарея садится, но' + NB + 'всё важное уже на' + NB + 'главной' : 'Battery’s low, but everything important is right here';
return {
t: ru
? { lang: 'Язык', langAria: 'Язык сайта', wifi: 'Работаю удалённо из' + NB + 'Белграда' }
: { lang: 'Lang', langAria: 'Site language', wifi: 'Working remotely from Belgrade' },
langBadge: ru ? 'РУ' : 'EN',
cvHref: ru ? 'https://docs.google.com/document/d/1C1IZlYzz1tL0Mf9m_cxdZPyUfV02FP1Gg9hhsa7BfzQ/edit?tab=t.0#heading=h.w6nop8rtqbyk' : 'https://docs.google.com/document/d/1TS9HV3ecjrl0lzUnDDgy5jc5VsHDw7kUU3lnsiE9G6s/edit?tab=t.0#heading=h.w6nop8rtqbyk',
langName: ru ? 'Язык' : 'Language',
clock: clock,
greet: greet,
myTime: mine === hm
? (ru ? 'У' + NB + 'меня сейчас такое' + NB + 'же время' : 'Same time here for me')
: (ru ? 'У' + NB + 'меня сейчас ' + mine : 'It’s ' + mine + ' here for me'),
battText: batt + NB + '%',
battHint: battHint,
battW: Math.max(0.6, Math.round(13.13 * batt) / 100),

isRu: ru ? 'true' : 'false',
isEn: ru ? 'false' : 'true',
ruCls: ru ? 'on' : '',
enCls: ru ? '' : 'on',
setRu: () => { try { localStorage.setItem('lang', 'ru'); } catch (e) {} this.setState({ lang: 'ru' }); },
setEn: () => { try { localStorage.setItem('lang', 'en'); } catch (e) {} this.setState({ lang: 'en' }); }
};
}
goTo(pos) {
this.setState({ pos: pos });
}
wrap(v) {
const n = this.photoList.length;
return v - n * Math.round(v / n);
}
renderVals() {
const list = this.photoList;
const n = list.length;
const W = this.W;
const pos = this.state.pos;
const active = ((pos % n) + n) % n;
const x = pos;
const ease = this.DURATION + 'ms cubic-bezier(0.22, 1, 0.36, 1)';
// remember the position we are coming from, so a photo that jumps between the far slots moves instantly
if (this._shownPos !== x) { this._fromPos = this._shownPos == null ? x : this._shownPos; this._shownPos = x; }
const slot = (v) => { let q = ((v % n) + n) % n; return q === n - 1 ? -1 : q; };
const slides = list.map((p, i) => {
// slots in strict order: -1 = previous (left), 0 = current, 1..n-2 = next ones waiting on the right.
// The photo that leaves on the left is parked straight on the far right (no transition),
// so photos never fly back across the frame and always follow left-to-right order.
const d = slot(i - x);
const jumped = Math.abs(d - slot(i - this._fromPos)) > 1;
const shown = d >= -1 && d <= 1 && !jumped;
const tx = d >= 0 ? d * W : d * W * this.PARALLAX;
const shade = d < 0 ? Math.min(-d, 1) * this.MAX_SHADE : 0;
const still = !shown;
return {
src: p.src,
alt: p.alt,
tx: Math.round(tx * 100) / 100,
z: Math.round((d + 3) * 10),
vis: shown ? 'visible' : 'hidden',
tr: still ? 'none' : 'transform ' + ease,
trShade: still ? 'none' : 'opacity ' + ease,
shade: Math.round(shade * 1000) / 1000,
edge: d > 0.001 ? '-8px 0 24px rgba(0,0,0,0.25)' : 'none'
};
});
const photos = list.map((p, i) => ({
label: 'Фото ' + (i + 1) + ' из ' + n,
dot: list[active].bg === 'dark'
? (i === active ? '#fff' : 'rgba(255,255,255,0.45)')
: (i === active ? '#000' : 'rgba(0,0,0,0.3)'),
dotShadow: list[active].bg === 'dark' ? '0 0 2px rgba(0,0,0,0.35)' : '0 0 2px rgba(255,255,255,0.35)',
pick: () => { this.goTo(pos + ((i - active) % n + n) % n); this.restartAuto(); }
}));
const sb = this.statusBar();
return {
...sb,
slides: slides,
photos: photos,
// hover effects (slider controls, case labels, Polkadot drift, Nova cover lift) live in the <helmet> CSS
ledgerSheets: this.ledgerSheets(),
prev: () => { this.goTo(pos - 1); this.restartAuto(); },
next: () => { this.goTo(pos + 1); this.restartAuto(); }
};
}
}

var app = document.getElementById('app');
var comp = new Component({});
function paint() {
  handlers = [];
  var html = tpl(TPL, comp.renderVals());
  morphdom(app, '<div id="app">' + html + '</div>', {
    onBeforeElUpdated: function (from, to) { if (from.getAttribute && from.getAttribute('style') && !to.hasAttribute('style')) to.setAttribute('style', from.getAttribute('style')); return !from.isEqualNode(to); }
  });
}
var queued = false;
function schedule() { if (queued) return; queued = true; Promise.resolve().then(function () { queued = false; paint(); }); }
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-on]');
  if (!el) return;
  var f = handlers[+el.getAttribute('data-on')];
  if (typeof f === 'function') f(e);
});
paint();
if (comp.componentDidMount) comp.componentDidMount();
})();
</script>
</body>
